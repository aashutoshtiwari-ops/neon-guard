<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Allow-list TTFT</title>
  <style>
    :root { color-scheme: light; --bg: #f4f1ea; --ink: #1c1916; --muted: #5c564e; --card: #fffcf7; --line: #ddd4c6; --accent: #1f4d3a; --warn: #8b1e1e; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
    main { max-width: 960px; margin: 0 auto; padding: 24px 16px 48px; }
    h1 { font-size: 1.3rem; margin: 0 0 8px; }
    .lede { color: var(--muted); margin: 0 0 16px; font-size: 0.95rem; }
    .pills { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
    .pill { background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; font-size: 0.85rem; }
    .layout { display: grid; grid-template-columns: 200px 1fr; gap: 16px; }
    @media (max-width: 760px) { .layout { grid-template-columns: 1fr; } }
    .nav { display: flex; flex-direction: column; gap: 6px; }
    .nav button, .ghost { background: var(--card); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font: inherit; cursor: pointer; text-align: left; }
    .nav button.on { background: var(--accent); color: #fff; border-color: var(--accent); }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
    .card h2 { margin: 0 0 8px; font-size: 1.05rem; }
    .card ol { margin: 8px 0 12px; padding-left: 1.2rem; }
    .look { background: #efe8da; border-radius: 8px; padding: 10px 12px; font-size: 0.9rem; margin-bottom: 12px; }
    .go { background: var(--accent); color: #fff; border: 0; border-radius: 8px; padding: 10px 16px; font: inherit; cursor: pointer; }
    .go:disabled { opacity: 0.5; }
    textarea { width: 100%; min-height: 56px; border: 1px solid var(--line); border-radius: 10px; padding: 10px; font: inherit; margin: 8px 0; }
    .metrics { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; margin: 12px 0; }
    .metric { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
    .metric b { display: block; font-size: 1.1rem; }
    .metric span { font-size: 0.75rem; color: var(--muted); }
    .chat { white-space: pre-wrap; font-size: 0.9rem; border-top: 1px solid var(--line); padding-top: 12px; min-height: 48px; }
    .err { color: var(--warn); }
    table { width: 100%; border-collapse: collapse; font-size: 0.85rem; margin-top: 12px; }
    th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); }
  </style>
</head>
<body>
  <main>
    <h1>Allow-list vs TTFT</h1>
    <p class="lede">Four ways to write the same Postgres allow-list check. Only the code path to the first token changes. One uvicorn worker.</p>
    <div class="pills" id="status"></div>
    <div class="layout">
      <nav class="nav" id="nav"></nav>
      <section class="card" id="panel"></section>
    </div>
    <h2>Recent requests</h2>
    <button class="ghost" id="refreshLogs" type="button">Refresh logs</button>
    <div id="logs"></div>
  </main>
  <script>
    const promptDefault = "What is time to first token, in one sentence?";

    function parseSse(block) {
      let event = "message", data = "";
      for (const line of block.split("\n")) {
        if (line.startsWith("event:")) event = line.slice(6).trim();
        if (line.startsWith("data:")) data += line.slice(5).trim();
      }
      return { event, data };
    }

    function metrics(label, meta, text) {
      const cell = (k, v) => `<div class="metric"><b>${v ?? "—"}</b><span>${k}</span></div>`;
      return `<div class="metrics">
        ${cell("role", label)}
        ${cell("TTFT ms", meta.ttft_ms)}
        ${cell("client TTFT ms", meta.client_ttft_ms)}
        ${cell("allowlist ms", meta.allowlist_ms)}
      </div><div class="chat">${text || ""}</div>`;
    }

    async function consume(res, t0, onMeta) {
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.error || res.statusText);
      }
      const reader = res.body.getReader();
      const dec = new TextDecoder();
      let buf = "", text = "", meta = {};
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buf += dec.decode(value, { stream: true });
        const parts = buf.split("\n\n");
        buf = parts.pop();
        for (const part of parts) {
          const { event, data } = parseSse(part);
          if (!data) continue;
          if (event === "meta") {
            meta = JSON.parse(data);
            if (t0 != null) meta.client_ttft_ms = Math.round(performance.now() - t0);
            if (onMeta) onMeta(meta);
            continue;
          }
          if (data === "[DONE]") continue;
          try {
            const json = JSON.parse(data);
            if (json.error) { text += "\n" + json.error; continue; }
            const delta = json.choices?.[0]?.delta?.content;
            if (delta) text += delta;
          } catch (_) {}
        }
      }
      return { meta, text };
    }

    function openChat(scenario, role, prompt) {
      return fetch(`/chat/completions?scenario=${encodeURIComponent(scenario)}&role=${encodeURIComponent(role)}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ messages: [{ role: "user", content: prompt }] }),
      });
    }

    function render(s) {
      document.querySelectorAll(".nav button").forEach((b) => b.classList.toggle("on", b.dataset.id === s.id));
      const pair = s.kind === "pair";
      document.getElementById("panel").innerHTML = `
        <h2>${s.title}</h2>
        <p>${s.summary}</p>
        <ol>${s.steps.map((x) => `<li>${x}</li>`).join("")}</ol>
        <div class="look"><strong>Look for:</strong> ${s.look_for}</div>
        <textarea id="prompt">${promptDefault}</textarea>
        <button class="go" id="run">${pair ? "Run pair" : "Run"}</button>
        <div id="out"></div>`;
      document.getElementById("run").onclick = () => run(s);
    }

    async function run(s) {
      const btn = document.getElementById("run");
      const out = document.getElementById("out");
      const prompt = document.getElementById("prompt").value;
      btn.disabled = true;
      out.textContent = "Running…";
      try {
        if (s.kind === "single") {
          const t0 = performance.now();
          const { meta, text } = await consume(await openChat(s.id, "solo", prompt), t0);
          out.innerHTML = metrics("solo", meta, text);
        } else {
          const tV = performance.now();
          const victimP = consume(await openChat(s.id, "victim", prompt), tV);
          await new Promise((r) => setTimeout(r, 80));
          const tB = performance.now();
          const resB = await openChat(s.id, "blocker", prompt);
          let unlock;
          const got = new Promise((r) => { unlock = r; });
          const rest = consume(resB, tB, unlock);
          await got;
          const [victim, blocker] = await Promise.all([victimP, rest]);
          out.innerHTML =
            "<h3>Victim</h3>" + metrics("victim", victim.meta, victim.text) +
            "<h3>Blocker</h3>" + metrics("blocker", blocker.meta, blocker.text || "(sync allow-list, no model)");
        }
        await loadLogs();
      } catch (e) {
        out.innerHTML = `<p class="err">${e.message || e}</p>`;
      } finally {
        btn.disabled = false;
      }
    }

    async function loadLogs() {
      const data = await fetch("/requests?limit=20").then((r) => r.json());
      if (!data.rows.length) {
        document.getElementById("logs").textContent = "No rows yet.";
        return;
      }
      document.getElementById("logs").innerHTML = `<table>
        <thead><tr><th>Time</th><th>Scenario</th><th>Status</th><th>TTFT</th><th>Total</th><th>Error</th></tr></thead>
        <tbody>${data.rows.map((r) => `<tr>
          <td>${(r.created_at || "").slice(11, 19)}</td>
          <td>${r.scenario || ""}</td>
          <td>${r.status || ""}</td>
          <td>${r.ttft_ms ?? "—"}</td>
          <td>${r.total_ms ?? "—"}</td>
          <td class="err">${r.error || ""}</td>
        </tr>`).join("")}</tbody></table>`;
    }

    document.getElementById("refreshLogs").onclick = loadLogs;

    (async () => {
      const h = await fetch("/health").then((r) => r.json());
      document.getElementById("status").innerHTML =
        `<span class="pill">DB: ${h.database || "off"}</span>
         <span class="pill">Key: ${h.gateway_key ? "set" : "missing"}</span>
         <span class="pill">Model: ${h.model}</span>`;
      const { scenarios } = await fetch("/demos").then((r) => r.json());
      const nav = document.getElementById("nav");
      nav.innerHTML = scenarios.map((s) => `<button type="button" data-id="${s.id}">${s.title}</button>`).join("");
      nav.querySelectorAll("button").forEach((b) => {
        b.onclick = () => render(scenarios.find((s) => s.id === b.dataset.id));
      });
      render(scenarios[0]);
    })();
  </script>
</body>
</html>
